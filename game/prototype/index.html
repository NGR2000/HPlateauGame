<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="実在の風景を楽しむ世界と、実地形から街を育てる創作の世界。">
  <title>実際のデータと創作の世界</title>
  <link rel="stylesheet" href="./home.css">
  <script src="./home.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">風景を巡る。街をつくる。</p>
      <h1>どちらの世界へ？</h1>
      <p class="intro">空から、地上から。<br>ひとつの風景に、ふたつの入口。</p>
    </header>
    <div class="worlds">
      <a class="world real" href="./play.html" aria-labelledby="real-title" aria-describedby="real-description">
        <div class="scene" aria-hidden="true"><div class="sun"></div><div class="ridge back"></div><div class="ridge front"></div><div class="balloon"></div></div>
        <div class="content">
          <p class="kind">DATA WORLD</p>
          <h2 id="real-title">実際のデータの世界</h2>
          <p id="real-description">実際の地形と航空写真の上で、<br>気球や車から風景を楽しむ。</p>
          <span class="enter">今までの世界へ <span aria-hidden="true">↗</span></span>
        </div>
      </a>
      <div class="creative-entry">
      <a class="world creative" href="./play.html?world=creative&amp;mode=chase" aria-labelledby="creative-title" aria-describedby="creative-description">
        <div class="scene" aria-hidden="true"><div class="sun"></div><div class="road"></div><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="car"></div></div>
        <div class="content">
          <p class="kind">CREATIVE WORLD</p>
          <h2 id="creative-title">創作の世界</h2>
          <p id="creative-description">実際の地形を土台に、<br>自分だけの街を育てていく。</p>
          <span class="enter">創作の舞台へ <span aria-hidden="true">↗</span></span>
        </div>
      </a>
      <a class="edit-city-link" href="./city-editor.html">街を作り変える</a>
      </div>
    </div>
    <p class="note">創作の舞台は、佐賀・嘉瀬川の地形に広がる架空の街。<br>チームの気球を追いながら、駅前や公園を巡ってみましょう。</p>
  </main>
  <footer>実在の風景と、これからつくる風景。</footer>
</body>
</html>
